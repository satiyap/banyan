# A release of the desktop app: `pnpm release 2.1.0` sets the version, tags
# v2.1.0 and pushes; this builds the Go app (cmd/banyan, Wails 3) for Mac
# (Apple silicon) and Windows (x64) and publishes one GitHub release holding
# Banyan-mac-arm64.dmg, update.json and Banyan-windows-x64-setup.exe, only
# once the builds and their checks have worked. No link ever changes:
#   releases/latest/download/Banyan-mac-arm64.dmg          (the site's download)
#   releases/latest/download/Banyan-windows-x64-setup.exe  (the Windows download)
#   releases/latest/download/update.json                  (what installed Macs check)
#
# Running it by hand (Actions → Release → Run workflow) only builds: the disk
# image is attached to the run and nothing is published.
#
# Nothing but a tag starts it, so docs and ordinary pushes never make a release.
#
# Signing. With the five secrets below set, the app is signed with a Developer
# ID and notarized, and opens on any Mac. Without them the release is still
# built, ad-hoc signed, and says so in its notes: on another Mac it is blocked
# the first time and must be allowed in System Settings ▸ Privacy & Security.
#   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_ID,
#   APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#
# Updates. UPDATE_SIGNING_KEY (made with `go run ./cmd/updatesign -generate`)
# signs update.json. A tagged release fails without it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The version
        id: version
        run: |
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_type }}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            # The tag and package.json say the same version, as `pnpm release` leaves them.
            test "$v" = "$(node -p "require('./package.json').version")"
          else
            v="$(node -p "require('./package.json').version")-dev"
          fi
          echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-dev)?$'
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Test
        run: GOWORK=off go test ./...
      # A Developer ID, when the repository holds one, goes into a keychain of its own for this run.
      - name: Signing identity
        id: sign
        env:
          CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "$CERT" ] || [ -z "$APPLE_ID" ]; then
            echo "::warning::No signing certificate in this repository: the release is ad-hoc signed"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass="$(openssl rand -hex 16)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          test -n "$identity"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: |
          sh scripts/build-mac.sh
          codesign --verify --strict dist/Banyan.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Banyan.app/Contents/Info.plist)" = "$VERSION"
      - name: Disk image
        env:
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: |
          stage="$(mktemp -d)"
          cp -R dist/Banyan.app "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -quiet -volname Banyan -srcfolder "$stage" -fs HFS+ -format UDZO dist/Banyan-mac-arm64.dmg
          if [ -n "$SIGN_IDENTITY" ]; then
            codesign --force --timestamp --sign "$SIGN_IDENTITY" dist/Banyan-mac-arm64.dmg
          fi
          ls -l dist/Banyan-mac-arm64.dmg
      - name: Notarize
        if: steps.sign.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit dist/Banyan-mac-arm64.dmg --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple dist/Banyan-mac-arm64.dmg
          spctl --assess --type open --context context:primary-signature dist/Banyan-mac-arm64.dmg
      # The manifest installed apps follow to update themselves. It is signed
      # with UPDATE_SIGNING_KEY, whose public half the app carries; a release
      # without it would leave every installed app behind, so it is required.
      # Made after notarization, so it names the stapled disk image.
      - name: Update manifest
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "::error::UPDATE_SIGNING_KEY is not set"; exit 1; }
          # This release's section of CHANGELOG.md, without the Markdown marks.
          awk -v v="## $VERSION " 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md \
            | sed -e 's/\*\*//g' -e 's/`//g' > "$RUNNER_TEMP/notes.txt"
          test -s "$RUNNER_TEMP/notes.txt" || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          GOWORK=off go run ./cmd/updatesign -version "$VERSION" -dmg dist/Banyan-mac-arm64.dmg \
            -notes "$RUNNER_TEMP/notes.txt" -out dist/update.json
          cat dist/update.json
      - uses: actions/upload-artifact@v4
        with:
          name: banyan-mac
          path: |
            dist/Banyan-mac-arm64.dmg
            dist/update.json
          if-no-files-found: error

  # The Windows installer, from the same tag and the same code. The desk's
  # recorded answers are replayed with Edge as the renderer before it is built.
  # It is not code-signed: Windows SmartScreen warns the first time it is run.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The version
        id: version
        run: |
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_type }}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            test "$v" = "$(node -p "require('./package.json').version")"
          else
            v="$(node -p "require('./package.json').version")-dev"
          fi
          echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-dev)?$'
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Test
        run: GOWORK=off go test ./...
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          command -v makensis || choco install nsis -y --no-progress
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          sh scripts/build-windows.sh
          test -s dist/Banyan-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: banyan-windows
          path: dist/Banyan-windows-x64-setup.exe
          if-no-files-found: error

  # Only a pushed tag publishes, and only once both builds worked; a run by hand never does.
  publish:
    needs: [build, windows]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          ls -la files
          note=""
          if [ "$SIGNED" != true ]; then
            note="This build is not signed with an Apple Developer ID. macOS blocks it the first time: open it once, then go to System Settings ▸ Privacy & Security and choose Open Anyway."
          fi
          note="$note

          Windows: Banyan-windows-x64-setup.exe installs for the signed-in user. It is not code-signed, so Windows SmartScreen warns the first time: choose More info, then Run anyway. It needs Microsoft Edge, which Windows 10 and 11 include. Print the plain-paper test and check it against a leaf before printing a real cheque from Windows."
          gh release create "${{ github.ref_name }}" files/* --repo "${{ github.repository }}" \
            --title "Banyan ${GITHUB_REF_NAME#v}" --generate-notes --notes "$note" --latest

  # The Mac App Store build, from the same tag and the same code: sandboxed,
  # without its own updater, signed for the store and uploaded to App Store
  # Connect, where it is submitted for review by hand. It runs beside the
  # direct download and never holds it up: without its secrets it says so and
  # stops, and a failure here leaves the GitHub release as it is.
  #   MAS_CERT_P12_BASE64, MAS_CERT_PASSWORD           Apple Distribution
  #   MAS_INSTALLER_P12_BASE64, MAS_INSTALLER_PASSWORD Mac Installer Distribution
  #   MAS_PROVISION_PROFILE_BASE64                     Mac App Store profile for com.banyan.desk
  #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (shared with the direct build)
  appstore:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Secrets
        id: secrets
        env:
          CERT: ${{ secrets.MAS_CERT_P12_BASE64 }}
          INSTALLER: ${{ secrets.MAS_INSTALLER_P12_BASE64 }}
          PROFILE: ${{ secrets.MAS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$CERT" ] || [ -z "$INSTALLER" ] || [ -z "$PROFILE" ]; then
            echo "::warning::No App Store signing secrets: the Mac App Store build was skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Signing identities
        id: sign
        if: steps.secrets.outputs.ready == 'true'
        env:
          CERT: ${{ secrets.MAS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          INSTALLER: ${{ secrets.MAS_INSTALLER_P12_BASE64 }}
          INSTALLER_PASSWORD: ${{ secrets.MAS_INSTALLER_PASSWORD }}
          PROFILE: ${{ secrets.MAS_PROVISION_PROFILE_BASE64 }}
        run: |
          kc="$RUNNER_TEMP/appstore.keychain-db"
          kcpass="$(openssl rand -hex 16)"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INSTALLER" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          # A .p12 is DER: it starts with a SEQUENCE byte. Anything else means
          # the secret holds something other than the certificate (a password
          # pasted into the wrong secret, say), and saying which saves a guess.
          for f in app:MAS_CERT_P12_BASE64 installer:MAS_INSTALLER_P12_BASE64; do
            file="$RUNNER_TEMP/${f%%:*}.p12"
            if [ "$(head -c1 "$file" | od -An -tx1 | tr -d ' ')" != 30 ] || [ "$(wc -c < "$file")" -lt 1000 ]; then
              echo "::error::${f##*:} does not hold a base64 .p12 ($(wc -c < "$file") bytes once decoded)"; exit 1
            fi
          done
          security import "$RUNNER_TEMP/app.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$kc" -P "$INSTALLER_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/banyan.provisionprofile"
          # grep -E, not sed: macOS's sed has no alternation in a basic pattern.
          app="$(security find-identity -v -p codesigning "$kc" | grep -oE '"Apple Distribution: [^"]+"' | head -1 | tr -d '"')"
          installer="$(security find-identity -v "$kc" | grep -oE '"(3rd Party Mac Developer Installer|Mac Installer Distribution): [^"]+"' | head -1 | tr -d '"')"
          test -n "$app" || { echo "::error::No Apple Distribution identity in MAS_CERT_P12_BASE64"; exit 1; }
          test -n "$installer" || { echo "::error::No Mac Installer Distribution identity in MAS_INSTALLER_P12_BASE64"; exit 1; }
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
      - name: Build for the store
        if: steps.secrets.outputs.ready == 'true'
        env:
          STORE: mas
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAS_SIGN_IDENTITY: ${{ steps.sign.outputs.app }}
          INSTALLER_IDENTITY: ${{ steps.sign.outputs.installer }}
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          export PROVISION_PROFILE="$RUNNER_TEMP/banyan.provisionprofile"
          sh scripts/build-mac.sh
          codesign --verify --strict dist/appstore/Banyan.app
          codesign -d --entitlements - dist/appstore/Banyan.app | grep -q com.apple.security.app-sandbox
          pkgutil --check-signature dist/appstore/Banyan.pkg
      - name: Upload to App Store Connect
        if: steps.secrets.outputs.ready == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app --type macos --file dist/appstore/Banyan.pkg \
            --username "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
