# Every push and pull request: the Go desktop app's tests on macOS (the desk
# against its recorded answers, sync, printing, rendering), the Banyan server
# on Linux, and the TypeScript reference's typecheck and unit tests. The
# Electron app is frozen: its end-to-end run is no longer part of CI. Nothing
# here prints: the app refuses to in tests.
name: CI

# Docs, licence text and the other workflows do not run it. A newer push to
# the same branch stops the run before it: macOS minutes cost ten times Linux ones.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', '.github/workflows/image.yml', '.github/workflows/release.yml']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', '.github/workflows/image.yml', '.github/workflows/release.yml']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

  # The desktop app (Go on Wails 3) renders with the Mac's own WebKit, so it is tested on macOS.
  desk:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: GOWORK=off go vet ./...
      - name: Test
        run: GOWORK=off go test ./...
      - name: Build
        run: sh scripts/build-mac.sh

  # The Banyan server is a Go program that runs on Linux, so it is tested there:
  # keys, the register's revisions, members' reports, and a desk syncing with it.
  server:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./cmd/banyan-server ./internal/server
      - name: Test
        run: go test ./internal/server/
      - name: Build
        run: go build -trimpath -o /tmp/banyan-server ./cmd/banyan-server

